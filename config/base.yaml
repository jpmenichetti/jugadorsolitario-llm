# Configuración de entrenamiento LoRA (mlx-lm). Los scripts completan model, data y adapter_path.
fine_tune_type: lora
train: true
mask_prompt: true          # el modelo solo aprende de tus artículos, no del pedido
batch_size: 2
grad_accumulation_steps: 2
iters: 60                  # 1 época exacta: en los entrenamientos 1 y 2 el mejor punto fue la iteración 60
learning_rate: 5.0e-5
num_layers: 16
max_seq_length: 4096
grad_checkpoint: true      # ahorra memoria
steps_per_report: 10
steps_per_eval: 15
val_batches: -1
save_every: 15
seed: 42
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
